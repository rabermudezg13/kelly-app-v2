name: Verify Kelly App
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            kelly-app-v2/backend/requirements.txt
            kelly-app-v2/backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kelly-app-v2/frontend/package-lock.json
      - name: Require change documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_change_log.py "$BASE_SHA"
      - run: python -m pip install -r kelly-app-v2/backend/requirements-dev.txt
      - run: npm --prefix kelly-app-v2/frontend ci
      - run: python scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-summary
          path: |
            .harness/report.md
            .harness/report.json
          if-no-files-found: warn
